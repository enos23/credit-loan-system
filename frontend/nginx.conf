server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses on the fly.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache static assets aggressively. Vite produces hashed filenames so the
    # cache is automatically invalidated on rebuild.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unmatched route returns index.html so React Router
    # handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for orchestrators.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
